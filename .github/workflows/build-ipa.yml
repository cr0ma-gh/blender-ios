# Build the unsigned Blender-iPad-Unofficial .ipa on a cloud macOS runner (no local Mac).
#
# Recipe adapted from the proven community workflow at
# https://github.com/Toemeler/blender-iOS-ipa (which publishes working IPAs built from
# blender/blender@ios). Adjusted to apply THIS repo's patches; Blender's original branding is kept.
# The exact iOS-library fetch and dylib-bundling details may still need tuning against
# that reference on first run — compare if a step fails.
#
# Trigger: manually from the Actions tab, or by pushing a tag like v1.0.0.
name: build-ipa

on:
  workflow_dispatch:
    inputs:
      publish_release:
        description: "Publish .ipa as a GitHub Release"
        type: boolean
        default: true
  push:
    tags: ["v*"]

permissions:
  contents: write   # needed to attach the .ipa to a Release

env:
  # Last commit of blender/blender@ios that builds against the precompiled lib-ios_arm64
  # (Blender 5.0, "iOS: Correct Info.plist CFBundleVersion version string").
  # The newer ios tip a1de44dd (5.1.2) needs iOS deps rebuilt from source with `make deps`
  # (no 5.1 lib-ios_arm64 exists) — see patches/wip-5.1/.
  BLENDER_COMMIT: d9b6fe34ddce527d93b97c0bf42ad92cebac4e4e

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 350   # a full Blender build is large
    strategy:
      fail-fast: false
      matrix:
        include:
          # Blender 5.0 + new tablet UI from blender/blender@ios-workshop
          # (Menu Behavior Preferences #144838, Experimental editor dock #144945)
          # + touch/keyboard UI backports from main (Quad View resizing, number-button
          # arrow stepping, hold-shortcut tool switching).
          - variant: tablet
            extra_patches: patches/tablet-ui.patch patches/tablet-ui-backports.patch
          # Blender 5.0 as on the ios branch, without the workshop UI.
          - variant: legacy
            extra_patches: ""
    env:
      IPA_NAME: Blender-iPad-Unofficial-${{ matrix.variant }}.ipa

    steps:
      - name: Checkout this overlay repo
        uses: actions/checkout@v4
        with:
          path: overlay

      - name: Fetch Blender source at the pinned commit (with LFS)
        run: |
          git init blender
          cd blender
          git remote add origin https://projects.blender.org/blender/blender.git
          git fetch --depth 1 origin "$BLENDER_COMMIT"
          git checkout FETCH_HEAD
          git lfs install
          git lfs pull || true
          echo "startup.blend bytes: $(wc -c < release/datafiles/startup.blend) (must be large, not ~131)"

      - name: Cache iOS / host libraries
        uses: actions/cache@v4
        with:
          path: |
            blender/lib/ios_arm64
            blender/lib/macos_arm64
          key: blender-ios-libs-${{ env.BLENDER_COMMIT }}

      - name: Fetch precompiled iOS libraries
        working-directory: blender
        run: |
          python3 ./build_files/utils/make_update.py --no-blender --use-ios-libraries
          test -d lib/ios_arm64 || { echo "::error::iOS libraries (lib/ios_arm64) missing"; exit 1; }

      - name: Apply this repo's patches
        run: |
          cd blender
          for p in ${{ matrix.extra_patches }}; do
            echo "Applying $p"
            git apply "../overlay/$p"
          done
          git apply ../overlay/patches/blender-ipad.patch
          # Original Blender branding: upstream Info.plist and official icon are kept as-is.
          echo "app icon bytes: $(wc -c < release/ios/Blender.app/Assets/blender_icon.icns) (must be large, not an LFS pointer)"

      - name: Configure (iOS, Xcode generator)
        run: |
          # APPLE_TARGET_DEVICE=ios sets up the whole iOS toolchain (cross-compile, arm64,
          # SDK, deployment target, Python paths). Do NOT also pass CMAKE_SYSTEM_NAME /
          # CMAKE_OSX_* by hand — that breaks the iOS Python library detection.
          cmake -S blender -B build_ios -G Xcode \
            -DAPPLE_TARGET_DEVICE=ios \
            -DCMAKE_XCODE_ATTRIBUTE_CODE_SIGNING_ALLOWED=NO \
            -DCMAKE_XCODE_ATTRIBUTE_CODE_SIGNING_REQUIRED=NO \
            -DCMAKE_XCODE_ATTRIBUTE_CODE_SIGN_IDENTITY="" \
            -DCMAKE_XCODE_ATTRIBUTE_DEVELOPMENT_TEAM=""

      - name: Build (Release, install target)
        run: cmake --build build_ios --config Release --target install -- -quiet -jobs 3

      - name: Package .ipa
        run: |
          # Locate the real installed Blender.app containing the executable.
          # Note: CMake creates an empty placeholder directory at build_ios/bin/Blender.app during configure;
          # the actual compiled and assembled bundle lives in bin/Release/Blender.app or bin/Release-iphoneos/Blender.app.
          APP=$(find build_ios -type d -name "Blender.app" | grep -Ei "iphoneos|Release" | head -1)
          if [ -z "$APP" ] || [ ! -f "$APP/Blender" ]; then
            for candidate in $(find build_ios -type d -name "Blender.app"); do
              if [ -f "$candidate/Blender" ]; then
                APP="$candidate"
                break
              fi
            done
          fi
          echo "Selected app bundle: $APP"
          test -n "$APP" || { echo "::error::Blender.app not found"; exit 1; }
          test -f "$APP/Blender" || { echo "::error::Executable $APP/Blender not found! Build failed or empty placeholder selected."; exit 1; }
          echo "Blender executable verified: $(ls -lh "$APP/Blender")"

          # Strip non-runtime build artifacts (.o/.a) so on-device / sideloading signers do not fail
          find "$APP" \( -name "*.o" -o -name "*.a" \) -print -delete || true

          # Bundle precompiled iOS dylibs into the app (mirrors the reference recipe).
          LIBDST="$APP/Assets/lib"; mkdir -p "$LIBDST"
          find blender/lib/ios_arm64 -name '*.dylib' \( -type f -o -type l \) -exec cp -fL {} "$LIBDST/" \; || true
          find "$APP" -name 'libpython*.dylib' -exec cp -fn {} "$LIBDST/" \; || true

          # Fix Mach-O platform headers, framework paths (Accelerate), and ad-hoc sign all dylibs/so.
          # Upstream precompiled numpy .so files have macOS platform=1 and point to macOS Accelerate paths,
          # causing dyld aborts on iOS ("mach-o file, but is for macOS").
          python3 overlay/build/fix_macho.py "$APP"

          # iOS app icon PNGs from Blender's official blender_icon.icns (iOS ignores .icns),
          # Files app integration, binary Info.plist. Name/bundle id stay upstream's.
          bash overlay/build/prepare_ios_bundle.sh "$APP" blender/release/ios/Blender.app/Assets/blender_icon.icns
          codesign --force --deep --sign - "$APP" || true
          rm -rf Payload && mkdir -p Payload
          cp -R "$APP" Payload/
          find Payload -type l ! -exec test -e {} \; -delete || true
          zip -qr "$IPA_NAME" Payload
          echo "Final IPA size: $(du -sh "$IPA_NAME")"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: Blender-iPad-Unofficial-${{ matrix.variant }}-ipa
          path: ${{ env.IPA_NAME }}
          if-no-files-found: error

      # Publish Release on tag pushes or on manual workflow_dispatch with publish_release=true
      - name: Publish Release
        if: startsWith(github.ref, 'refs/tags/') || (github.event_name == 'workflow_dispatch' && (inputs.publish_release == true || inputs.publish_release == 'true'))
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [[ "${{ github.ref }}" == refs/tags/* ]]; then
            TAG="${{ github.ref_name }}"
          else
            TAG="build-${{ github.run_number }}"
          fi
          # Both matrix jobs publish into the same release: whichever finishes first creates it,
          # the other one just attaches its IPA.
          gh release create "$TAG" "$IPA_NAME" \
            --repo "${{ github.repository }}" \
            --title "Blender iPad (Unofficial) $TAG" \
            --notes "Unsigned IPAs built from blender/blender@ios (${BLENDER_COMMIT}, Blender 5.0) + UI & input adaptations. 'tablet' adds the new touch UI from blender/blender@ios-workshop (menu behavior, editor dock) and UI backports from main (Quad View resizing, number-button arrow stepping, hold-shortcut tool switching); 'legacy' is the plain ios branch. Sideload with Sideloadly, AltStore, SideStore, or TrollStore (free Apple ID = 7-day expiry). Unofficial build — not affiliated with the Blender Foundation." \
          || gh release upload "$TAG" "$IPA_NAME" --repo "${{ github.repository }}" --clobber
